e(.4)}40.17%{opacity:.8;transform:translateX(0) scale(.7)}54.23%{opacity:0;transform:translateX(-10px) scale(2.3)}100.00%{opacity:0;transform:translateX(-10px) scale(2.3)}}@keyframes hd1{0.00%{opacity:0;transform:translateX(0) scale(.4)}39.86%{opacity:0;transform:translateX(0) scale(.4)}40.17%{opacity:.8;transform:translateX(0) scale(.7)}54.23%{opacity:0;transform:translateX(0px) scale(2.3)}100.00%{opacity:0;transform:translateX(0px) scale(2.3)}}@keyframes hd2{0.00%{opacity:0;transform:translateX(0) scale(.4)}39.86%{opacity:0;transform:translateX(0) scale(.4)}40.17%{opacity:.8;transform:translateX(0) scale(.7)}54.23%{opacity:0;transform:translateX(10px) scale(2.3)}100.00%{opacity:0;transform:translateX(10px) scale(2.3)}}</style>
